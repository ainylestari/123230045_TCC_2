<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Notes App</title>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>✨ Notes App</h1>
      <p class="subtitle">Simpan ide, tugas, dan catatan pentingmu dengan rapi</p>

      <input type="text" id="judul" placeholder="Masukkan judul catatan...">
      <textarea id="isi" placeholder="Tulis isi catatanmu di sini..."></textarea>
      <button class="main-btn" onclick="saveNote()">Simpan Catatan</button>
    </div>

    <div class="card">
      <h2>📚 Daftar Catatan</h2>
      <div id="notes"></div>
    </div>
  </div>

  <script src="script.js"></script>
  
</body>
</html>
